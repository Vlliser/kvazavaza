<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- ======================================================
         МОБИЛЬНЫЙ VIEWPORT: запрещает зум, фиксирует высоту
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover"
    />

    <!-- ======================================================
         LANDSCAPE ORIENTATION LOCK
    ====================================================== -->
    <meta name="screen-orientation" content="landscape" />
    <meta name="x5-orientation" content="landscape" />
    <meta name="full-screen" content="yes" />

    <!-- ======================================================
         PWA — ANDROID (Chrome)
         display:standalone убирает адресную строку!
    ====================================================== -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2C1654" />

    <!-- ======================================================
         PWA — iOS (Safari)
    ====================================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kvazavaza" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- SEO -->
    <title>Kvazavaza — Пиксельное приключение на Годовщину</title>
    <meta
      name="description"
      content="Пиксельное приключение в стиле Undertale. Секретная игра на годовщину."
    />

    <!-- ======================================================
         ШРИФТЫ GOOGLE: Press Start 2P + VT323
         preconnect ускоряет загрузку
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Глобальные стили -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <!-- Оверлей «Поверни телефон» — показывается в portrait режиме -->
    <div id="rotate-overlay">
      <div class="rotate-icon">📱</div>
      <p>Поверни телефон горизонтально</p>
      <p class="rotate-sub">Игра работает в режиме landscape</p>
    </div>

    <!-- Контейнер для Phaser canvas -->
    <div id="game-container"></div>

    <!-- Точка входа JavaScript -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
