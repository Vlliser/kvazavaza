<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- ======================================================
         МОБИЛЬНЫЙ VIEWPORT: запрещает зум, фиксирует высоту
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover"
    />

    <!-- ======================================================
         LANDSCAPE ORIENTATION LOCK
    ====================================================== -->
    <meta name="screen-orientation" content="landscape" />
    <meta name="x5-orientation" content="landscape" />
    <meta name="full-screen" content="yes" />

    <!-- ======================================================
         PWA — ANDROID (Chrome)
         display:standalone убирает адресную строку!
    ====================================================== -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2C1654" />

    <!-- ======================================================
         PWA — iOS (Safari)
    ====================================================== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kvazavaza" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- SEO -->
    <title>Kvazavaza — Пиксельное приключение на Годовщину</title>
    <meta
      name="description"
      content="Пиксельное приключение в стиле Undertale. Секретная игра на годовщину."
    />

    <!-- ======================================================
         ШРИФТЫ GOOGLE: Press Start 2P + VT323
         preconnect ускоряет загрузку
    ====================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap"
      rel="stylesheet"
    />

    <!-- Глобальные стили -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <!-- Оверлей «Поверни телефон» — только для мобильных в portrait -->
    <div id="rotate-overlay">
      <div class="rotate-icon">📱</div>
      <p>Поверни телефон горизонтально</p>
      <p class="rotate-sub">Игра работает в режиме landscape</p>
      <button id="rotate-dismiss" style="
        margin-top: 20px;
        padding: 10px 20px;
        background: #4A0E8F;
        color: white;
        border: 2px solid #9B59B6;
        font-family: 'Press Start 2P', monospace;
        font-size: 8px;
        cursor: pointer;
        border-radius: 4px;
      ">Играть всё равно</button>
    </div>

    <!-- Контейнер для Phaser canvas -->
    <div id="game-container"></div>

    <!-- Умный обработчик ориентации -->
    <script>
      const overlay    = document.getElementById('rotate-overlay')
      const gameDiv    = document.getElementById('game-container')
      const dismissBtn = document.getElementById('rotate-dismiss')

      // Проверяем — это реально мобильный телефон?
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

      function checkOrientation() {
        const isPortrait = window.innerHeight > window.innerWidth
        if (isMobile && isPortrait) {
          overlay.classList.add('show')
          gameDiv.style.display = 'none'
        } else {
          overlay.classList.remove('show')
          gameDiv.style.display = 'flex'
        }
      }

      // Кнопка «Играть всё равно» — принудительно скрываем оверлей
      dismissBtn.addEventListener('click', () => {
        overlay.classList.remove('show')
        overlay.style.display = 'none'
        gameDiv.style.display = 'flex'
      })

      // Слушаем поворот экрана
      window.addEventListener('resize',            checkOrientation)
      window.addEventListener('orientationchange', checkOrientation)

      // Первичная проверка (с задержкой — браузер может не успеть)
      checkOrientation()
      setTimeout(checkOrientation, 200)
    </script>

    <!-- Точка входа JavaScript -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
